name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: runway-detection-api
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Update Lambda Function
      run: |
        aws lambda update-function-code \
          --function-name runway-inference \
          --image-uri ${{ secrets.ECR_REPOSITORY_URI }}:latest

    - name: Wait for Lambda to finish updating
      run: |
        aws lambda wait function-updated --function-name runway-inference

    - name: Smoke test deployed endpoint
      env:
        ENDPOINT_URL: https://onq18p4b8l.execute-api.eu-west-1.amazonaws.com/default/health
      run: |
        for i in 1 2 3 4 5; do
          status=$(curl -s -o /tmp/body -w "%{http_code}" "$ENDPOINT_URL" || echo "000")
          echo "Attempt $i: HTTP $status"
          if [ "$status" = "200" ]; then
            echo "Health check passed:"
            cat /tmp/body
            exit 0
          fi
          sleep 10
        done
        echo "Health check failed after 5 attempts"
        cat /tmp/body || true
        exit 1
